<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bpharm Notes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:white;
width:100%;
max-width:400px;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
animation:fadeIn 1s ease;
}

h1{
color:#1e3c72;
margin-bottom:10px;
}

.price{
font-size:28px;
font-weight:bold;
color:green;
margin:15px 0;
}

.qr{
width:250px;
max-width:100%;
border-radius:10px;
margin:15px 0;
}

.btn{
display:block;
text-decoration:none;
padding:14px;
margin-top:15px;
border-radius:10px;
font-weight:bold;
color:white;
}

.pay{
background:#1e3c72;
}

.whatsapp{
background:#25D366;
}

.info{
margin-top:15px;
font-size:15px;
color:#555;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>
<body>

<div class="card">

<h1>📚 Bpharm Notes</h1>

<p>Premium PDF Notes</p>

<div class="price">₹49</div>

<img src="qr-code.jpg" class="qr" alt="QR Code">

<p><b>Scan QR & Pay ₹49</b></p>

<a class="btn pay">Scan & Pay</a>

<div class="info">
✅ After payment send screenshot on WhatsApp
</div>

<a href="https://wa.me/917887783662"
class="btn whatsapp">
Open WhatsApp
</a>

</div>

</body>
</html>
